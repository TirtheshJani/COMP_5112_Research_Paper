[project]
name = "jigsaw"
version = "0.2.0"
description = "Reachy Mini reads a two-sided de Bruijn jigsaw (COMP 5112)"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "opencv-python>=4.10"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "hypothesis>=6"]
experiment = ["matplotlib>=3.9", "scipy>=1.14", "statsmodels>=0.14"]   # statsmodels: test only (S2 E7)
robot = ["reachy-mini"]            # S3 pins the exact version after the probes
voice = ["piper-tts>=1.3", "sounddevice>=0.5", "faster-whisper>=1.0", "onnxruntime>=1.18"]
viewer = ["flask>=3"]
print = ["reportlab>=4", "pillow>=10", "pypdfium2>=4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jigsaw*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --ignore=tests/robot_live"

[tool.ruff]
line-length = 160

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
